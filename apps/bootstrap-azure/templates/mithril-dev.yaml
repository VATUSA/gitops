apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mithril-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: mithril-dev
    server: https://kubernetes.default.svc
  project: default
  source:
    path: mithril/overlays/dev-azure
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
