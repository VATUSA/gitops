apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zan-api-secrets-es
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: eso-bao
    kind: SecretStore
  target:
    name: zan-api-secrets
  dataFrom:
    # KV v2 entry someone needs to write in OpenBao: VATSIM_CLIENT_ID, VATSIM_CLIENT_SECRET,
    # VATUSA_API_KEY, SESSION_SECRET (see api/.env.example for what each one is).
    - extract:
        key: zan/dev/api
