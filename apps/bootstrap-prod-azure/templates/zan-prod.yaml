apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zan-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: zan-prod
    server: https://kubernetes.default.svc
  project: default
  source:
    # overlays/prod directly: ZAN never ran from this path on DOKS, so it needs no prod-azure
    # layer, and this is the overlay common-release.yml bumps.
    path: zan/overlays/prod
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
