apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- ../../base/api
- ../../base/discord-bot-v3
- ../../base/google-workspace
- ../../base/www
- certificate.yaml
- api-ingress.yaml
- api-configmap.yaml
- www-ingress.yaml
- www-configmap.yaml
patches:
- path: www-deployment-patch.yaml
  target:
    kind: Deployment
    name: www
- path: www-redis-envfrom-patch.yaml
  target:
    kind: Deployment
    name: www
- path: www-worker-redis-patch.yaml
  target:
    kind: Deployment
    name: www-worker
- path: api-deployment-patch.yaml
  target:
    kind: Deployment
    name: api
- path: api-redis-envfrom-patch.yaml
  target:
    kind: Deployment
    name: api
- path: api-queue-redis-envfrom-patch.yaml
  target:
    kind: Deployment
    name: api-queue
- path: api-worker-redis-envfrom-patch.yaml
  target:
    kind: Deployment
    name: api-worker
images:
- name: vatusa/api
  newName: vatusa/api
  newTag: 91802ca5a99edac70826c9a4a1e33d33c63df098
- name: vatusa/discord-bot-v3
  newName: vatusa/discord-bot-v3
  newTag: 23a724052fe6ed748adc544e1967b0e304e43ad6
- name: vatusa/google-workspace-integration
  newName: vatusa/google-workspace-integration
  newTag: 1.1.37
- name: vatusa/www
  newName: vatusa/www
  newTag: f3e0d49adb1d539c46990e99f076a013a2eeaedf
