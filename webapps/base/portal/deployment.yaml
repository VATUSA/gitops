apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels:
    app: portal
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      name: portal
      labels:
        app: portal
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - portal
                topologyKey: kubernetes.io/hostname
      containers:
        - name: portal
          image: vatusa/portal
          imagePullPolicy: Always
          # Node SSR steady-state settles ~300-360Mi under render-cache load;
          # request tracks the observed peak with headroom.
          # CPU request/limit tracks observed 341-407m under real traffic
          # (previously 100m/500m caused throttling -> probe timeouts -> restarts -> 502/503).
          resources:
            requests:
              cpu: 400m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: webapps-secrets
            - configMapRef:
                name: webapps-config
      restartPolicy: Always
