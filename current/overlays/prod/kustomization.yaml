apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- ../../base/api
- ../../base/discord-bot-v3
- ../../base/google-workspace
- ../../base/www
- certificate.yaml
- api-ingress.yaml
- api-configmap.yaml
- www-ingress.yaml
- www-configmap.yaml
patches:
- path: www-deployment-patch.yaml
  target:
    kind: Deployment
    name: www
- path: www-redis-envfrom-patch.yaml
  target:
    kind: Deployment
    name: www
- path: www-worker-redis-patch.yaml
  target:
    kind: Deployment
    name: www-worker
- path: api-deployment-patch.yaml
  target:
    kind: Deployment
    name: api
- path: api-redis-envfrom-patch.yaml
  target:
    kind: Deployment
    name: api
- path: api-queue-redis-envfrom-patch.yaml
  target:
    kind: Deployment
    name: api-queue
- path: api-worker-redis-envfrom-patch.yaml
  target:
    kind: Deployment
    name: api-worker
images:
- name: vatusa/api
  newName: vatusa/api
  newTag: 03126e9c72c907648cb4785a8f1e36d22164c53f
- name: vatusa/discord-bot-v3
  newName: vatusa/discord-bot-v3
  newTag: a3275b189d32c58d737f58660b4af6b8c79a03c2
- name: vatusa/google-workspace-integration
  newName: vatusa/google-workspace-integration
  newTag: 1.1.39
- name: vatusa/www
  newName: vatusa/www
  newTag: 3e5a6e7f7f7aca951cbf4bd381161cbd54a8f331
