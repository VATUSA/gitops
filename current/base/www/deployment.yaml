apiVersion: apps/v1
kind: Deployment
metadata:
  name: www
  labels:
    app: www
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: www
  template:
    metadata:
      name: www
      labels:
        app: www
    spec:
      containers:
        - name: www
          image: vatusa/www
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 25m
              memory: 150Mi
            limits:
              cpu: 250m
              memory: 300Mi
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            # The hourly vatsim:sync job (www-worker) saturates the DB shared with
            # www's PHP-FPM pool for a few minutes each hour, which can stall FPM
            # workers past the old 5s/3-failure threshold and trigger a pointless
            # kubelet restart of an otherwise-healthy pod. Widened so a transient
            # stall doesn't get treated as a dead container.
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 5
          envFrom:
            - secretRef:
                name: www-secrets
            - configMapRef:
                name: www-config
      restartPolicy: Always
