- op: replace
  path: /spec/replicas
  value: 1
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: 15m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
# mithril already drains in-flight requests on SIGTERM (with_graceful_shutdown in
# src/main.rs), but SIGTERM arrives before ingress-nginx has dropped the pod from its
# endpoints, so a request or two still reach a pod that has stopped accepting. Holding
# SIGTERM back for 5s closes that race. Uses the native sleep action (no binary needed
# in the image). dev-azure only for now; carry to prod with the AKS move.
- op: add
  path: /spec/template/spec/containers/0/lifecycle
  value:
    preStop:
      sleep:
        seconds: 5
