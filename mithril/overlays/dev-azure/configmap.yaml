apiVersion: v1
kind: ConfigMap
metadata:
  name: mithril-config
  labels:
    app: mithril
data:
  DISABLE_ROSTER_POLLER: "true"
  # Per-pool; dev runs 1 replica x 2 pools = 4 connections. See prod overlay.
  DB_MAX_CONNECTIONS: "2"
  # Object storage: Cloudflare R2, shared with cobalt (see cobalt's dev-azure
  # configmap.yaml): same bucket, same R2 token in mithril-secrets, objects under
  # event-banners/<facility>/... Endpoint WITHOUT the bucket here: rust-s3 adds it,
  # path-style when DO_SPACES_PATH_STYLE is true.
  DO_SPACES_REGION: "auto"
  DO_SPACES_BUCKET: "vatusa-azure-dev"
  DO_SPACES_ENDPOINT: "https://11976c0a4f2b9d3e1176dba5177bf32c.r2.cloudflarestorage.com"
  DO_SPACES_PATH_STYLE: "true"
  DO_SPACES_PUBLIC_BASE_URL: "https://cdn.vatusa.dev"
