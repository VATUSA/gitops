# Daily job that truncates client IPs in vatusa-api-logs once a day's logs are
# older than the 90 days of full IPs promised by the privacy policy
# (www.vatusa.net/info/privacy#data-retention). See files/truncate_log_ips.py
# and the "IP truncation" section of README.md.
#
# Credentials come from the manually-created secret "log-ip-truncation-do-spaces"
# (a Spaces key scoped to vatusa-api-logs with read/write). Like
# fluent-bit-do-spaces, it is NOT tracked in Git:
#
#   kubectl create secret generic log-ip-truncation-do-spaces \
#     --namespace logging \
#     --from-literal=AWS_ACCESS_KEY_ID=<key> \
#     --from-literal=AWS_SECRET_ACCESS_KEY=<secret>
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-ip-truncation
data:
  truncate_log_ips.py: |
{{ .Files.Get "files/truncate_log_ips.py" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-ip-truncation
spec:
  schedule: "30 4 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: truncate
              image: python:3.13-slim
              command:
                - sh
                - -c
                - >-
                  pip install --quiet --no-cache-dir --disable-pip-version-check
                  --target /tmp/deps 'boto3>=1.35,<2'
                  && exec python /app/truncate_log_ips.py
              env:
                - name: PYTHONPATH
                  value: /tmp/deps
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: HOME
                  value: /tmp
                - name: S3_BUCKET
                  value: vatusa-api-logs
                - name: S3_ENDPOINT
                  value: https://sfo3.digitaloceanspaces.com
                - name: S3_REGION
                  value: sfo3
                - name: RETENTION_DAYS
                  value: "90"
                - name: LOOKBACK_DAYS
                  value: "7"
              envFrom:
                - secretRef:
                    name: log-ip-truncation-do-spaces
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 384Mi
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: log-ip-truncation
            - name: tmp
              emptyDir: {}
