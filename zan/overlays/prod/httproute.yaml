# Gateway API equivalent of ingress.yaml (incl. from-to-www-redirect).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zan
  namespace: zan-prod
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: vatusa
      namespace: envoy-gateway-system
      # Pinned: zan-prod may also attach to the :80 listener (ACME HTTP-01).
      sectionName: www-zanartcc-org
  hostnames: [www.zanartcc.org]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ group: "", kind: Service, name: zan-api-service, port: 80, weight: 1 }]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ group: "", kind: Service, name: zan-site-service, port: 80, weight: 1 }]
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zan-apex-redirect
  namespace: zan-prod
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: vatusa
      namespace: envoy-gateway-system
      sectionName: zanartcc-org
  hostnames: [zanartcc.org]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, hostname: www.zanartcc.org, statusCode: 301 }
---
# Lets the shared Gateway (envoy-gateway-system) use this namespace's cert Secrets.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: envoy-gateway-certs
  namespace: zan-prod
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
