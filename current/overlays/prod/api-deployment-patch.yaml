# Right-size the prod api resources to observed usage. The base's 500Mi memory
# request reserved ~1.5Gi across 3 replicas against a ~290Mi total working set;
# trimming to 256Mi (still ~2.5x headroom) reclaims scheduler headroom on a
# memory-tight cluster. CPU request was below real usage (~350-470m vs 250m) and
# the 2500m limit was far above anything observed — bring both to honest values.
# 24h polling (289 samples) showed p50 26m but p95 877m / max 1003m — bursty,
# and the max is already brushing the 1000m limit (throttling risk at peak).
# Bumped request to 450m to reflect the real steady/burst mix; limit unchanged.
#
# The 2Gi memory limit is sized against php-fpm's pm.max_children (20, set in
# api's resources/docker/usr/local/etc/php-fpm.d/www.conf). At roughly 35MB RSS
# per worker a saturated pool needs ~700MB, so 2Gi now carries ~3x headroom --
# left as-is deliberately, since lowering a limit only moves the OOMKill
# threshold and reclaims no scheduler headroom (that comes from requests, which
# are already trimmed to 256Mi). Re-check both together if max_children changes.
# max_children was lowered 40 -> 20 because each busy worker holds a connection
# on the shared MySQL server; see that repo's pool config for the full rationale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: 450m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          # api's routes are gated behind Route::domain(config('app.url')) (see
          # RouteServiceProvider::mapApiRoutes), so any request without a matching
          # Host header 404s regardless of path - kubelet's httpGet probe doesn't
          # send one by default.
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: api.vatusa.net
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: api.vatusa.net
