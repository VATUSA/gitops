apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- ../../base/api
- ../../base/discord-bot-v3
- ../../base/google-workspace
- ../../base/www
- certificate.yaml
- api-ingress.yaml
- api-configmap.yaml
- www-ingress.yaml
- www-configmap.yaml
patches:
- path: www-deployment-patch.yaml
  target:
    kind: Deployment
    name: www
- path: api-deployment-patch.yaml
  target:
    kind: Deployment
    name: api
images:
- name: vatusa/api
  newName: vatusa/api
  newTag: 567a18c8280f6d5d6272936698070ebd17be1fb4
- name: vatusa/discord-bot-v3
  newName: vatusa/discord-bot-v3
  newTag: 1.1.18
- name: vatusa/google-workspace-integration
  newName: vatusa/google-workspace-integration
  newTag: 1.1.37
- name: vatusa/www
  newName: vatusa/www
  newTag: f4e3f1a13ea47b4207078ab36e63a529bbe5c1c8
