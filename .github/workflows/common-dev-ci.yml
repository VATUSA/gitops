name: Common Dev Deploy Workflow
on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      kustomization-folder:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ArgoCD
    uses: ./.github/workflows/common-gitops-bump.yml
    with:
      image-name: ${{ inputs.image-name }}
      kustomization-folder: ${{ inputs.kustomization-folder }}
      # AKS dev (vatusa.dev) is the only dev cluster since 2026-10-04. DOKS dev's
      # overlays/dev was deleted and overlays/dev-azure renamed to overlays/dev.
      overlay: dev
      tag: ${{ github.sha }}
    secrets: inherit
