# Gateway API equivalent of base/ingress.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mithril
  namespace: mithril-prod
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: vatusa
      namespace: envoy-gateway-system
  hostnames: [api.vatusa.net]
  rules:
    # /v3(/|$)(.*) -> /$2
    - matches: [{ path: { type: PathPrefix, value: /v3 } }]
      backendRefs: [{ group: "", kind: Service, name: mithril-service, port: 80, weight: 1 }]
      filters:
        - type: URLRewrite
          urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } }
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - { name: Strict-Transport-Security, value: "max-age=31536000; includeSubDomains" }
---
# nginx had limit-rps 1 (burst 5) + limit-connections 5 per client IP. Envoy's limits are
# fixed-window: 60/minute per client IP (CF-Connecting-IP, see ClientTrafficPolicy).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: mithril-ratelimit
  namespace: mithril-prod
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mithril
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - sourceCIDR: { type: Distinct, value: 0.0.0.0/0 }
          limit: { requests: 60, unit: Minute }
