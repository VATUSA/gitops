apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zan-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: zan-dev
    server: https://kubernetes.default.svc
  project: default
  source:
    path: zan/overlays/dev
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
