apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Prod on AKS (West US 2). Built on ../prod so it inherits prod's image tag (CI's
# prod release bumps ../prod only) and carries only the Azure differences.
resources:
- ../prod
patches:
- path: configmap-patch.yaml
- path: deployment-patch.yaml
  target:
    kind: Deployment
    name: mithril
# Cutover hold: keeps the roster poller off until the cutover commit removes it,
# so AKS and DOKS never both poll (docs/prod-cutover-playbook.md §2.3).
- path: cutover-hold.yaml
