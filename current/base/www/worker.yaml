apiVersion: apps/v1
kind: Deployment
metadata:
  name: www-worker
  labels:
    app: www-worker
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: www-worker
  template:
    metadata:
      name: www-worker
      labels:
        app: www-worker
    spec:
      containers:
        - name: www-worker
          image: vatusa/www
          imagePullPolicy: IfNotPresent
          command:
            - php
          args:
            - artisan
            - schedule:work
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 300Mi
          # Same env as www. Without www-config the worker had no DB_SSL_CA, so on
          # Azure MySQL (REQUIRE SSL) every DB call was refused and vatsim:sync failed
          # hourly from the 2026-10-15 cutover.
          envFrom:
            - secretRef:
                name: www-secrets
            - configMapRef:
                name: www-config
      restartPolicy: Always
