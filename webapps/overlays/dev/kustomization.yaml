apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- namespace.yaml
- certificate.yaml
- portal-ingress.yaml
- staff-ingress.yaml
- configmap.yaml
patches:
- path: portal-replicas-patch.yaml
  target:
    kind: Deployment
    name: portal
- path: staff-replicas-patch.yaml
  target:
    kind: Deployment
    name: staff
images:
- name: vatusa/portal
  newName: vatusa/portal
  newTag: ddb2c373b72f1bbcbf2e9527bce2a353d57a9af0
- name: vatusa/staff
  newName: vatusa/staff
  newTag: fb9a7ee14f0ef16c87f4a46c6fe593753bdd5b4b
