apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- ../../base/api
- ../../base/discord-bot-v3
- ../../base/google-workspace
- ../../base/www
- certificate.yaml
- api-ingress.yaml
- api-configmap.yaml
- www-ingress.yaml
- www-configmap.yaml
patches:
- path: www-deployment-patch.yaml
  target:
    kind: Deployment
    name: www
- path: www-redis-envfrom-patch.yaml
  target:
    kind: Deployment
    name: www
- path: www-worker-redis-patch.yaml
  target:
    kind: Deployment
    name: www-worker
- path: api-deployment-patch.yaml
  target:
    kind: Deployment
    name: api
- path: api-redis-envfrom-patch.yaml
  target:
    kind: Deployment
    name: api
- path: api-queue-redis-envfrom-patch.yaml
  target:
    kind: Deployment
    name: api-queue
- path: api-worker-redis-envfrom-patch.yaml
  target:
    kind: Deployment
    name: api-worker
images:
- name: vatusa/api
  newName: vatusa/api
  newTag: 03454e6377811d1ad81b5223d9fdd300fb6f509d
- name: vatusa/discord-bot-v3
  newName: vatusa/discord-bot-v3
  newTag: 3092c305073265a6363f48f3e3f206f395f0c754
- name: vatusa/google-workspace-integration
  newName: vatusa/google-workspace-integration
  newTag: 1.1.39
- name: vatusa/www
  newName: vatusa/www
  newTag: 5fdab8bb4a080344e5713640c016ec09dd03037e
