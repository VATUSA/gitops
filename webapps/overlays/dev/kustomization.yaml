apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- namespace.yaml
- certificate.yaml
- portal-ingress.yaml
- staff-ingress.yaml
- configmap.yaml
patches:
- path: portal-replicas-patch.yaml
  target:
    kind: Deployment
    name: portal
- path: staff-replicas-patch.yaml
  target:
    kind: Deployment
    name: staff
images:
- name: vatusa/portal
  newName: vatusa/portal
