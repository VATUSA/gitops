apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- namespace.yaml
- certificate.yaml
- portal-ingress.yaml
- staff-ingress.yaml
- configmap.yaml
patches:
- path: portal-replicas-patch.yaml
  target:
    kind: Deployment
    name: portal
- path: staff-replicas-patch.yaml
  target:
    kind: Deployment
    name: staff
images:
- name: vatusa/portal
  newName: vatusa/portal
  newTag: 70e042df723b6bd4af5eec254bd8aae88de4bcd2
- name: vatusa/staff
  newName: vatusa/staff
  newTag: e1171b4df09f3a3927807ef42fc4fb3beea92138
