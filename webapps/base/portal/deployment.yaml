apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  labels:
    app: portal
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      name: portal
      labels:
        app: portal
    spec:
      # Required (not preferred): both replicas landing on the same node let a single
      # correlated crash (e.g. a Node/webstreams race) take the whole service down.
      # Cluster has 2 nodes and replicas: 2 — bump the node pool before raising replicas.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - portal
              topologyKey: kubernetes.io/hostname
      containers:
        - name: portal
          image: vatusa/portal
          imagePullPolicy: Always
          # Node SSR steady-state settles ~300-360Mi under render-cache load;
          # request tracks the observed peak with headroom.
          # CPU request/limit tracks observed 341-407m under real traffic
          # (previously 100m/500m caused throttling -> probe timeouts -> restarts -> 502/503).
          # Do not lower cpu request/limit below this - see incident note above.
          resources:
            requests:
              cpu: 400m
              memory: 420Mi
            limits:
              cpu: 1000m
              memory: 640Mi
          ports:
            # The app listens on 3000 (Dockerfile ENV PORT=3000); portal-service
            # already targets 3000. This was declared as 80 and is informational
            # only, so nothing broke — but it made the port story hard to read.
            - containerPort: 3000
          # All three probes hit /api/health, a dependency-free route handler.
          # They previously hit `/`, which server-side renders the homepage and
          # fetches news + events from Cobalt: a slow render failed liveness
          # three times over and got the pod killed, even though the process was
          # healthy and restarting it could not fix a backend. Liveness must
          # test "is this process serving HTTP", not "is Cobalt up".
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: webapps-secrets
            - configMapRef:
                name: webapps-config
      restartPolicy: Always
      # Explicit rather than relying on the default, because the SIGTERM handler
      # in instrumentation.ts sizes its Sentry flush and its self-SIGKILL
      # watchdog against this number. Same value as the default — no behaviour
      # change, just making the contract visible from both sides.
      terminationGracePeriodSeconds: 30
