# For hostnames in DNS zones the `letsencrypt` issuer's Cloudflare token can't edit, such as
# tenant-owned zanartcc.org. The hostname must already resolve to this cluster's ingress.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01
spec:
  acme:
    email: "vatusa6@vatusa.net"
    server: "https://acme-v02.api.letsencrypt.org/directory"
    privateKeySecretRef:
      name: letsencrypt-http01
    solvers:
      # Envoy Gateway (ingress-nginx retired 2026-11-20). The solver's HTTPRoute is created
      # in the Certificate's namespace; the Gateway's :80 listener admits it via
      # allowedRoutes (apps/envoy-gateway-prod-azure/templates/gateway.yaml).
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: vatusa
                namespace: envoy-gateway-system
