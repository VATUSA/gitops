cert-manager:
  installCRDs: true
  # Gateway API support for the letsencrypt-http01 issuer's gatewayHTTPRoute solver
  # (Envoy Gateway, apps/envoy-gateway-prod-azure). Needs the Gateway API CRDs present.
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true
  prometheus:
    enabled: false
  # Requests anchored to observed usage (controller ~62Mi, webhook ~24Mi,
  # cainjector ~87Mi) so the scheduler accounts for what these already consume.
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      cpu: 100m
      memory: 192Mi
  webhook:
    # DOKS upgrade preflight rejects webhook timeoutSeconds > 29 (chart default is 30).
    timeoutSeconds: 29
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 96Mi
  cainjector:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi