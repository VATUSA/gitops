apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zan-prod
resources:
- ../../base
- namespace.yaml
- configmap.yaml
- certificate.yaml
- ingress.yaml
- backup-cronjob.yaml
patches:
# This volume holds the only copy of prod's zan.db and uploads, and its StorageClass deletes the
# disk with the PVC. Keep ArgoCD from removing it on a prune or when the Application is deleted.
- target:
    kind: PersistentVolumeClaim
    name: zan-api-data
  patch: |
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: zan-api-data
      annotations:
        argocd.argoproj.io/sync-options: Delete=false,Prune=false
images:
- name: vatusa/zan-api
  newName: vatusa/zan-api
  newTag: e3b0c2588ad919b80fd5a101bf194b159a4a1dfa
- name: vatusa/zan-site
  newName: vatusa/zan-site
  newTag: e3b0c2588ad919b80fd5a101bf194b159a4a1dfa
