- op: replace
  path: /spec/replicas
  value: 1
- op: replace
  path: /spec/template/spec/containers/0/resources/requests/memory
  value: 320Mi
# Dev AKS runs on a single node (2026-09-29, cost). Portal's base request of 400m
# reflects prod traffic; dev idles at ~5m, and 400m left no room on one node for
# a rollout's surge pod. Only the *request* is lowered: the 1000m limit, whose
# earlier 500m value caused the throttling the base warns about, is unchanged.
- op: replace
  path: /spec/template/spec/containers/0/resources/requests/cpu
  value: 100m
# The base's *required* anti-affinity keeps two portal pods off the same node.
# With one node, a rollout's new pod can never schedule next to the old one, so
# every portal deploy since the shrink sat Pending (2026-10-03: old image still
# serving). One replica on one node has nothing to spread anyway.
- op: remove
  path: /spec/template/spec/affinity
