apiVersion: v2
name: fluent-bit-azure
description: Fluent Bit log forwarder (AKS) — ships ingress-nginx access logs to Azure Blob

type: application
version: 1.0.0
appVersion: 1.0.0

dependencies:
  - name: fluent-bit
    # Deliberately newer than apps/fluent-bit's 0.47.9 (fluent-bit 3.1.7), which
    # predates the azure_blob options this output needs: strftime templating in
    # `path`, `compress_blob`, and disk-backed buffering. The DOKS chart is left
    # alone — that path is read by the cluster serving production.
    version: 0.58.2
    repository: https://fluent.github.io/helm-charts
