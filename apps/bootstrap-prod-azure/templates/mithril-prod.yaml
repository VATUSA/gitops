# Automated sync (prune + selfHeal) since 2026-10-15, a day after the cutover. Namespace matches DOKS so
# in-cluster addresses copied in Secrets work unchanged.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mithril-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: mithril-prod
    server: https://kubernetes.default.svc
  project: default
  source:
    path: mithril/overlays/prod-azure
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
