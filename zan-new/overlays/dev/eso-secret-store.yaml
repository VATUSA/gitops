apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: eso-bao
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      auth:
        # Authenticate against OpenBao using a Kubernetes ServiceAccount token, the same
        # pattern current/overlays/dev uses.
        kubernetes:
          mountPath: "kubernetes"
          # This Vault Role must exist in OpenBao, bound to the zan-new-dev namespace and
          # the eso-bao ServiceAccount, before ExternalSecret sync will succeed - see
          # zan-api-secrets-es.yaml.
          role: "zan-new-dev"
          serviceAccountRef:
            name: "eso-bao"
