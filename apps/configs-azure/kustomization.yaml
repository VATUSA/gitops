apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: configs-azure

# Cluster-scoped configuration for AKS. Overlays apps/configs so the ClusterIssuer and
# the ArgoCD RBAC policy stay single-sourced — those are identical on both clusters and
# must not fork. The only difference is that AKS has no public ArgoCD Ingress.
resources:
  - ../configs

patches:
  # No public ArgoCD UI on AKS. The base Ingress would expose the local `admin`
  # password login to the internet with nothing in front of it: no Cloudflare Access,
  # and Dex/SSO is off on this instance (see
  # apps/argocd-azure). Nothing needs inbound HTTP to argocd-server here — there are no
  # GitHub webhooks, the repo is polled — so reach the UI/API over the tunnel instead:
  #
  #   kubectl --context vatusa-dev-aks-wus2 -n argocd port-forward svc/argocd-server 8080:443
  #   # then https://localhost:8080, or: argocd login localhost:8080 --insecure
  #
  # To restore a public UI, replace this delete with a host patch to a new hostname
  # (argocd.vatusa.dev is the DOKS prod ArgoCD) plus an
  # nginx.ingress.kubernetes.io/whitelist-source-range annotation, or register an SSO
  # client first.
  - patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: argocd
        namespace: argocd
