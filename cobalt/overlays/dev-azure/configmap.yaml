apiVersion: v1
kind: ConfigMap
metadata:
  name: cobalt-config
  labels:
    app: cobalt
data:
  APP_ENV: "staging"
  APP_BASE_URL: "https://cobalt.vatusa.dev/"
  POST_LOGIN_URL: "https://www.vatusa.dev/auth/callback"
  VATSIM_API2_URL: "https://api.vatsim.net/v2"
  COOKIE_DOMAIN: "vatusa.dev"
  REDIRECT_ALLOWLIST: "vatusa.net,vatusa.dev,www.vatusa.dev"
  MOODLE_URL: "https://academy-test.vatusa.net"
  # Per pod; dev runs 1 replica. See the prod overlay.
  DB_MAX_OPEN_CONNS: "5"

  # Azure Database for MySQL sets require_secure_transport=ON. "true" encrypts
  # and fully verifies the server certificate and hostname against the system
  # roots in the image; Azure's chain ends at DigiCert Global Root G2 and the
  # hostname is in the certificate SANs, so no CA file needs shipping.
  #
  # Deliberately absent from the DigitalOcean overlays: that endpoint presents a
  # certificate from DigitalOcean's own CA, which is not in the system roots.
  DB_TLS: "true"

  # Object storage: Cloudflare R2 (the prod decision of 2026-09-25), via cobalt's
  # existing S3 code, config only. Dev uses ONE bucket for both banners and policy
  # documents; their keys don't collide (event-banners/... vs docs/...). Prod gets the
  # two separate buckets. Endpoints are path-style and include the bucket, because
  # putObject signs the full URL path; region "auto" only feeds the SigV4 scope.
  # DO_SPACES_KEY/DO_SPACES_SECRET in cobalt-secrets hold an R2 token scoped to this
  # bucket (Object Read & Write), not DigitalOcean keys.
  DO_SPACES_REGION: "auto"
  DO_SPACES_BUCKET: "vatusa-azure-dev"
  DO_SPACES_ENDPOINT: "https://11976c0a4f2b9d3e1176dba5177bf32c.r2.cloudflarestorage.com/vatusa-azure-dev"
  DO_SPACES_PUBLIC_BASE_URL: "https://cdn.vatusa.dev"

  DO_SPACES_DOCS_REGION: "auto"
  DO_SPACES_DOCS_BUCKET: "vatusa-azure-dev"
  DO_SPACES_DOCS_ENDPOINT: "https://11976c0a4f2b9d3e1176dba5177bf32c.r2.cloudflarestorage.com/vatusa-azure-dev"
  DO_SPACES_DOCS_PUBLIC_BASE_URL: "https://cdn.vatusa.dev"
