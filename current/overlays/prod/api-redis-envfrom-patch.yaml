# Same pattern as www-redis-envfrom-patch.yaml: point REDIS_HOST/PORT/SCHEME/
# PASSWORD at the in-cluster ValKey instance instead of the DO-managed Redis
# in api-secrets, via a dedicated secretRef appended last in envFrom.
#
# Do NOT sync this ahead of api's fixed image (env('REDIS_SCHEME')-aware
# config/database.php) being live in prod — the old hardcoded 'tls' scheme
# will TLS-handshake against this plain-TCP ValKey and crash, exactly as
# happened with www/www-worker during the `current` cutover.
- op: add
  path: /spec/template/spec/containers/0/envFrom/-
  value:
    secretRef:
      name: valkey-prod-redis
