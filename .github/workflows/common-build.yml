name: Common Build Workflow
on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      relative-path:
        required: false
        type: string
      platforms:
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
permissions:
  contents: read
jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
          with:
            persist-credentials: false

        - name: Set up QEMU
          uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

        - name: Set up Docker Build
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

        - name: Log in to Docker Hub
          uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and push Docker image
          uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
          with:
            context: .
            file: ${{ inputs.relative-path }}Dockerfile
            target: app
            platforms: ${{ inputs.platforms }}
            push: true
            tags: |
              vatusa/${{ inputs.image-name }}:latest
              vatusa/${{ inputs.image-name }}:${{ github.sha }}
            cache-from: type=gha,scope=${{ inputs.image-name }}
            cache-to: type=gha,mode=min,scope=${{ inputs.image-name }}
