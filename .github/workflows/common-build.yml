name: Common Build Workflow

# Builds and pushes vatusa/<image-name>. Behaviour depends on the ref being built:
#   default branch -> :<sha> and :latest, and the GHA layer cache is updated
#   any other ref  -> :<sha> and :branch-<slug>; :latest is never touched and the cache is read-only
# Nothing here deploys; releasing to prod is gated separately in common-release.yml.
on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      relative-path:
        required: false
        type: string
      platforms:
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
permissions:
  contents: read
jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
          with:
            persist-credentials: false

        # Ref names are user-controlled, so everything goes through env and is sanitized here.
        - name: Compute image tags
          id: tags
          env:
            IMAGE_NAME: ${{ inputs.image-name }}
            REF_NAME: ${{ github.ref_name }}
            DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
            SHA: ${{ github.sha }}
          run: |
            export LC_ALL=C
            [[ "$IMAGE_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::image-name must match ^[a-z0-9][a-z0-9-]*$"; exit 1; }
            image="vatusa/${IMAGE_NAME}"
            tags="${image}:${SHA}"
            if [[ -n "$DEFAULT_BRANCH" && "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
              is_default=true
              tags+=$'\n'"${image}:latest"
            else
              is_default=false
              # Docker tags allow [A-Za-z0-9_.-], max 128 chars, and can't start with . or -
              slug="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' \
                | sed -E 's/[^a-z0-9._-]+/-/g' | cut -c1-100 | sed -E 's/^[-.]+//; s/[-.]+$//')"
              tags+=$'\n'"${image}:branch-${slug:-unnamed}"
            fi
            {
              echo "is-default=${is_default}"
              echo "tags<<TAGS_EOF"
              echo "$tags"
              echo "TAGS_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Building for ref '${REF_NAME}' (default branch: ${is_default}):"
            echo "$tags"

        - name: Set up QEMU
          if: contains(inputs.platforms, 'arm64')
          uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

        - name: Set up Docker Build
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

        - name: Log in to Docker Hub
          uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and push Docker image
          id: build
          uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
          with:
            context: .
            file: ${{ inputs.relative-path }}Dockerfile
            target: app
            platforms: ${{ inputs.platforms }}
            push: true
            tags: ${{ steps.tags.outputs.tags }}
            cache-from: type=gha,scope=${{ inputs.image-name }}
            # Only the default branch writes the cache, so branch builds can't evict its layers from
            # the repo's cache quota. They still read it.
            cache-to: ${{ steps.tags.outputs.is-default == 'true' && format('type=gha,mode=min,scope={0}', inputs.image-name) || '' }}

        - name: Summarize pushed images
          env:
            TAGS: ${{ steps.tags.outputs.tags }}
            DIGEST: ${{ steps.build.outputs.digest }}
            PLATFORMS: ${{ inputs.platforms }}
          run: |
            {
              echo "### Pushed images"
              echo
              while read -r t; do echo "- \`docker pull ${t}\`"; done <<< "$TAGS"
              echo
              echo "Platforms: \`${PLATFORMS}\` · digest: \`${DIGEST}\`"
            } >> "$GITHUB_STEP_SUMMARY"
